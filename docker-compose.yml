# ════════════════════════════════════════════════════════════════════════════════
# Mosquitto + InfluxDB + Node-RED + n8n (Postgres) + FastAPI + Grafana
# profile "extra": Home Assistant, Nginx Proxy Manager, Cloudflare Tunnel
#
# ใช้ไฟล์เดียวทั้ง Mac และ VPS — ทุก port bind 127.0.0.1 เท่านั้น
# (Docker ข้าม ufw → ห้ามใช้ "PORT:PORT" เฉย ๆ) เข้าถึงจากภายนอกผ่าน SSH tunnel
#
# ตัวแปรใน .env (ดู .env.example):
#   TZ, NODERED_USERNAME, NODERED_PASSWORD_HASH,
#   INFLUXDB_USERNAME/PASSWORD/ORG/BUCKET/ADMIN_TOKEN,
#   GRAFANA_ADMIN_USER/PASSWORD,
#   POSTGRES_USER/PASSWORD/DB, N8N_ENCRYPTION_KEY, N8N_PUBLIC_URL,
#   CLOUDFLARE_TUNNEL_TOKEN (เฉพาะ profile extra)
#
# รัน extras:  docker compose --profile extra up -d
# ════════════════════════════════════════════════════════════════════════════════

x-common: &common
  restart: unless-stopped
  networks:
    - iot_network

services:

  # ── Mosquitto — MQTT (localhost เท่านั้น) ────────────────
  # TODO: ก่อนเปิดให้ ESP32 ต่อจากภายนอก ต้องตั้ง password + ACL (ปิด allow_anonymous)
  mosquitto:
    <<: *common
    image: eclipse-mosquitto:2.0.22
    container_name: mosquitto
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    environment:
      - TZ=${TZ:-Asia/Bangkok}
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── InfluxDB — Time-series (UI :8086) ───────────────────
  # ⚠️ INIT_* ทำงานเฉพาะตอน volume ว่าง (ครั้งแรก)
  influxdb:
    <<: *common
    image: influxdb:2.7.12
    container_name: influxdb
    ports:
      - "127.0.0.1:8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    environment:
      - TZ=${TZ:-Asia/Bangkok}
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_USERNAME:?set in .env}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD:?set in .env}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:?set in .env}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:?set in .env}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_ADMIN_TOKEN:?set in .env}
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Node-RED (UI :1880, adminAuth เปิดใน settings.js) ────
  nodered:
    <<: *common
    image: nodered/node-red:5.0.7
    container_name: nodered
    ports:
      - "127.0.0.1:1880:1880"
    volumes:
      - nodered_data:/data
      - ./nodered/settings.js:/data/settings.js
      - ./nodered/package.json:/data/package.json
    environment:
      - TZ=${TZ:-Asia/Bangkok}
      - NODERED_USERNAME=${NODERED_USERNAME:?set in .env}
      - NODERED_PASSWORD_HASH=${NODERED_PASSWORD_HASH:?set in .env}
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_ADMIN_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:1880/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Postgres — DB ของ n8n (ไม่ publish port) ─────────────
  postgres:
    <<: *common
    image: postgres:16.15-alpine
    container_name: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - TZ=${TZ:-Asia/Bangkok}
      - POSTGRES_USER=${POSTGRES_USER:?set in .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set in .env}
      - POSTGRES_DB=${POSTGRES_DB:?set in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── n8n (UI :5678) ──────────────────────────────────────
  # N8N_SECURE_COOKIE=false: เข้าได้เฉพาะผ่าน SSH tunnel (http://localhost) ซึ่งไม่มี HTTPS
  # ถ้าเปิดออก internet ผ่าน reverse proxy + HTTPS ให้ลบบรรทัดนี้ และตั้ง N8N_PROTOCOL=https
  n8n:
    <<: *common
    image: n8nio/n8n:2.42.1
    container_name: n8n
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      - TZ=${TZ:-Asia/Bangkok}
      - GENERIC_TIMEZONE=${TZ:-Asia/Bangkok}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=${N8N_PUBLIC_URL:-http://localhost:5678/}
      - N8N_EDITOR_BASE_URL=${N8N_PUBLIC_URL:-http://localhost:5678/}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?set in .env}
      - N8N_METRICS=false
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── FastAPI starter (build จาก ./fastapi — build บน VPS เพราะ arch ต่างกัน) ──
  fastapi:
    <<: *common
    build: ./fastapi
    image: aiots-fastapi:0.1.0
    container_name: fastapi
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - TZ=${TZ:-Asia/Bangkok}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Grafana (UI :3000) ──────────────────────────────────
  grafana:
    <<: *common
    image: grafana/grafana:13.2.3
    container_name: grafana
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - TZ=${TZ:-Asia/Bangkok}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:?set in .env}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set in .env}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - GF_SERVER_ROOT_URL=http://localhost:3000
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ════════════ profile "extra" — ไม่รันโดย default ════════════

  homeassistant:
    <<: *common
    profiles: [extra]
    image: homeassistant/home-assistant:2026.9.4
    container_name: homeassistant
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - homeassistant_config:/config
    environment:
      - TZ=${TZ:-Asia/Bangkok}
    privileged: true
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8123 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  nginx-proxy-manager:
    <<: *common
    profiles: [extra]
    image: jc21/nginx-proxy-manager:2.16.0
    container_name: nginx-proxy-manager
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
      - "127.0.0.1:81:81"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    environment:
      - TZ=${TZ:-Asia/Bangkok}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:81"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ห้ามใช้ token เดียวกับเครื่อง Mac — สร้าง tunnel ใหม่สำหรับ VPS
  cloudflared:
    <<: *common
    profiles: [extra]
    image: cloudflare/cloudflared:2026.9.3
    container_name: cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      nginx-proxy-manager:
        condition: service_healthy

networks:
  iot_network:
    driver: bridge

volumes:
  mosquitto_data:
  mosquitto_log:
  influxdb_data:
  influxdb_config:
  nodered_data:
  postgres_data:
  n8n_data:
  homeassistant_config:
  grafana_data:
  npm_data:
  npm_letsencrypt:
